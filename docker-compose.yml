services:
  db:
    image: postgres:16-alpine
    container_name: real-estate-crm-db
    restart: unless-stopped
    ports:
      # Host 15432 avoids Windows Hyper-V excluded ranges (5433-5532 is blocked)
      # and the local Postgres already on 5432
      - "15432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: real_estate_crm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d real_estate_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
